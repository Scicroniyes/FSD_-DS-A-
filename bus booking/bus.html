<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUS BOOKING</title>

    <style>
        p{
           padding: 3px;
           color: #0d11d5;
        }
        h3{
            margin-left: 100px;
        }
    </style>
</head>
<body>
<div style="background-color: #f2f2f2; border: 1px solid #db0909; height: 650px; width: 400px; padding: 20px">
    <center>
    
        
    <h1 style="color: #0d11d5;">
        <img src="https://img.magnific.com/free-vector/school-bus-side-view_78370-9683.jpg?semt=ais_hybrid&w=740&q=80" alt="bus" width="50px" height="50px" style="border-radius: 30px; border: 1px solid #db0909;">
        BUS BOOKING SYSTEM</h1>


            


    </center>
    <h3>user information</h3>
    <p>user name: <input type="text" placeholder="Enter your name"></p>
    <p>user age: <input type="number" placeholder="Enter your age"></p>
    <p>adhar number: <input type="text" placeholder="Enter your adhar number"></p>
    <p> select your city: <select name="city" id="city">
        <option>GZB</option>
        <option>delhi</option>
        <option>meerut</option>
        <option>noida</option>
    </select></p>
    <p>select your traveling date: <input type="date"></p>
    


    <h3>bus information</h3>
    <p>select your bus type: </p>
    <p> AC bus:2000 <input type="radio" name="bus_type" value="ac"> </p>
    <p> NON-AC bus:1000 <input type="radio" name="bus_type" value="non_ac"> </p>
    <p>select your seat: <select name="seat" id="seat">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
    </select></p>
    <br>
    <button type="submit">click for save</button>

    <!-- it will show all your details with your total fare after you click save -->

    <script>
        const button = document.querySelector('button');
        button.addEventListener('click', function() {
            const name = document.querySelector('input[type="text"]').value;
            const age = document.querySelector('input[type="number"]').value;
            const adhar = document.querySelector('input[placeholder="Enter your adhar number"]').value;
            const city = document.querySelector('#city').value;
            const date = document.querySelector('input[type="date"]').value;
            const busType = document.querySelector('input[name="bus_type"]:checked') ? document.querySelector('input[name="bus_type"]:checked').value : '';
            const seat = document.querySelector('#seat').value;
            const limit = parseInt(seat, 10);
           let fare = 0;
            if (busType === 'ac') {
                fare = 2000*limit;
            } else if (busType === 'non_ac') {
                fare = 1000*limit;
            }
        

               alert(`User Information:\nName: ${name}\nAge: ${age}\nAdhar Number: ${adhar}\nCity: ${city}\nTraveling Date: ${date}\nBus Type: ${busType.toUpperCase()}\nSeat: ${seat}\nTotal Fare: ₹${fare}`);
        });
    </script>
    
</div>
</body>
</html>
