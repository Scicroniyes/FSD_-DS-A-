<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //code (arrow function)
        const add = (a, b) => {
            return a + b;
        }

        let a = prompt("Enter the first number:");
        let b = prompt("Enter the second number:");
        document.write("The sum of " + a + " and " + b + " is: " + add(parseInt(a), parseInt(b)));
    </script>
</body>
</html>
